services:
  poller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nta-poller
    restart: unless-stopped
    environment:
      - NTA_API_KEY=${NTA_API_KEY}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-65}
      - TARGET_AGENCIES=${TARGET_AGENCIES:-Dublin Bus,Go-Ahead Ireland,Iarnród Éireann,Luas}
      - DB_PATH=/app/data/nta_stats.db
      - GHOST_GRACE_MINUTES=${GHOST_GRACE_MINUTES:-20}
    volumes:
      - nta_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web server service (ready to enable once report_builder generates dist/ HTML pages)
